services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: assigner
      POSTGRES_PASSWORD: assigner
      POSTGRES_DB: assigner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assigner -d assigner"]
      interval: 3s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: assigner
    volumes:
      - ./migrations:/migrations:ro
    command: >
      sh -c 'for f in /migrations/*.sql; do
               [ -f "$$f" ] || continue;
               echo "Applying $$f";
               psql -h db -U assigner -d assigner -v ON_ERROR_STOP=1 -f "$$f" || exit 1;
             done;
             echo "Migrations completed"'
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgresql://assigner:assigner@db:5432/assigner
      REDIS_URL: redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: