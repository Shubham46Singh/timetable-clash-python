
services:
  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: timetable
      POSTGRES_PASSWORD: timetable
      POSTGRES_DB: timetable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetable -d timetable"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: postgres:16.3-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://timetable:timetable@postgres:5432/timetable
    volumes:
      - ./migrations:/migrations:ro
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        for f in $$(ls /migrations/*.sql | sort); do
          echo "Applying $$f"
          psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$f"
        done

  app:
    build: .
    image: timetable-clash:dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://timetable:timetable@postgres:5432/timetable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
